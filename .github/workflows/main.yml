name: 'Update schedule'

on:
  workflow_dispatch:

# 【新增】赋予该工作流读写仓库代码的权限（解决 403 报错的核心）
permissions:
  contents: write

jobs:
  push:
    runs-on: ${{ matrix.operating-system }}
    strategy:
      matrix:
        operating-system: [ 'ubuntu-latest' ]
    steps:
      - name: Set branch name
        id: vars
        run: echo "BRANCH_NAME=${{ github.repository_owner == 'Guovin' && 'gd' || 'master' }}" >> $GITHUB_ENV
        
      # 【优化】升级到 v4 版本，并显式保留凭证
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH_NAME }}
          persist-credentials: true # 确保 git push 时能读取到 token
          
      # 【优化】升级到 v5 版本
      - name: Run with setup-python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          update-environment: true
          cache: 'pipenv'
          
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
        
      - name: Install pipenv
        run: pip3 install --user pipenv
        
      - name: Install dependecies
        run: pipenv --python 3.13 && pipenv install --deploy
        
      - name: Update
        run: pipenv run dev
        
      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "Github Action Auto Updated"
            # 注意：--force 会覆盖远程历史，如果远程有别人提交的内容会被抹除。
            # 如果只有你自己用，保持 --force 即可；否则建议去掉 --force。
            git push --force 
          fi
